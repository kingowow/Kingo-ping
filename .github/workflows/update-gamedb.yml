name: Sync GameDB to Subfolder

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gamedb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Fetch latest GameDB data (gh-pages)
        run: |
          rm -rf temp_gamedb
          # دانلود مستقیم شاخه gh-pages بدون تاریخچه اضافی
          git clone --depth 1 --single-branch --branch gh-pages https://github.com temp_gamedb
          
          # بررسی اینکه دانلود واقعاً انجام شده است یا خیر
          if [ -d "temp_gamedb" ] && [ -f "temp_gamedb/stats.json" ]; then
            rm -rf temp_gamedb/.git
            rm -rf gamedb
            mv temp_gamedb gamedb
            echo "GameDB updated successfully."
          else
            echo "Failed to fetch GameDB or stats.json not found."
            exit 0
          fi

      - name: Commit and push changes
        run: |
          if [ -d "gamedb" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@://github.com"
            git add gamedb
            if ! git diff --staged --quiet; then
              git commit -m "chore: update gamedb database"
              git push
            else
              echo "No changes in GameDB."
            fi
          fi
          
